  language: en
  sections: ['Alert Description', "2. Check if it's sustained throttling or a spike"]
  adaptation: Adaptar apenas distinção entre utilização e necessidade de medir throttling; omitir afirmação de que o alerta prova throttling e todas as ações privilegiadas.
  applicability: Contêiner e limite de CPU são contexto adicional ausente; candidato apenas após adaptação e revisão; utilização de CPU por si só não prova throttling.
