  declared_license: MIT no projeto atual; confirmar texto e abrangência na versão v4.111.0 e direitos de conteúdo de terceiros antes de incorporar.
  attribution: GitLab.com / Runbooks e respectivos autores; preservar avisos de copyright e licença aplicáveis.
  language: en
  sections: ['Symptom- vs cause-based alerting', 'Querying: filtering and grouping', 'Aggregation']
  adaptation: Candidato a unidade curta em inglês e eventual tradução anotada; remover dependência de ferramentas GitLab e comandos, sem inventar evidência ou alterar significado; sujeita à revisão.
  applicability: Orientação geral para investigar latência e erros; exige sinais adicionais e não identifica sua causa. Trechos sobre recursos servem como contexto geral sujeito a revisão, não procedimento específico de CPU ou memória do serviço.
  decision: candidato_positivo_condicional
- id: GL-GITALY
  repository: https://gitlab.com/gitlab-com/runbooks
  path: docs/gitaly/git-high-cpu-and-memory-usage.md
  version: v2.180.0
  url: https://gitlab.com/gitlab-com/runbooks/-/blob/v2.180.0/docs/gitaly/git-high-cpu-and-memory-usage.md
  license_url: https://gitlab.com/gitlab-com/runbooks/-/blob/37572b449cf301711570a21ce6edeaf021fba7fc/LICENSE
  declared_license: MIT declarado no projeto atual; confirmar na versão fixada e direitos de terceiros.
  attribution: GitLab.com / Runbooks e respectivos autores; preservar avisos aplicáveis.
  language: en
  sections: ['Problem: git processes spawned by Gitaly may consume significant CPU and memory', Symptoms]
  adaptation: Somente eventual trecho de sintomas como distrator explicitamente rotulado; omitir comandos, ações e referências privadas.
  applicability: CPU e memória de processos Git/Gitaly exigem identificação de componente ausente nas fixtures; não extrapolar.
  decision: candidato_negativo_dificil
