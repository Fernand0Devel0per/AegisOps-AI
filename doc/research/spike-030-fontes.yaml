  attribution: GitLab.com / Runbooks e respectivos autores; preservar avisos aplicáveis.
  language: en
  sections: [Symptoms, '1. Check the triage dashboard to assess the impact']
  adaptation: Eventual distrator de latência Gitaly; não incorporar comandos nem orientações de acesso.
  applicability: P95 Gitaly não equivale a P95 de serviço fictício; documento sinaliza possível depreciação e contém remediação.
  decision: candidato_negativo_dificil
