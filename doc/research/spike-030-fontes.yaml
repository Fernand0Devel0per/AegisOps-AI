  language: en
  sections: ['Alert Description', '1. Identify the high-memory pods', '2. Check for a memory leak pattern']
  adaptation: Adaptar perguntas sobre uso relativo ao limite e evolução temporal, sem presumir contêiner; excluir limiares, OOM iminente, causa e comandos de mudança.
  applicability: Uso/limite é conceitualmente próximo ao INC-003; contêiner, séries detalhadas, leak e OOM não foram observados, e duas médias não demonstram tendência contínua.
