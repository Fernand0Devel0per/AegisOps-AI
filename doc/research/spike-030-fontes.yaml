  language: en
  sections: ['1. Triage (first 5 minutes)']
  adaptation: Apenas perguntas gerais sobre escopo e mudanças hipotéticas; excluir comandos, rollback, prioridade e limiares do autor.
  applicability: Respostas 5xx do serviço justificam investigação geral de abrangência; endpoint, região e mudanças recentes não são observados.
