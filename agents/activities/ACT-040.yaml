id: ACT-040
story_id: STORY-040
spec_id: SPEC-040
title: Preparar avaliação de hipóteses e revisão do PO
objective: Produzir casos e protocolo concretos sem executar modelos ou antecipar implementação.
status: in_review
agent:
  role: Agente de avaliação
  responsibility: Preparar e validar propostas; registrar revisão e limites sem presumir aceite.
inputs:
- AGENTS.md
- roadmap/stories/STORY-040.yaml
- agents/specs/SPEC-040.yaml
- agents/handoffs/HANDOFF-031.yaml
- doc/REQUIREMENTS.md
- doc/EVALUATION.md
- datasets/evaluation/queries.yaml
expected_outputs:
- datasets/hypothesis-evaluation/cases.yaml
- doc/decisions/story-040-avaliacao.md
- agents/handoffs/HANDOFF-040.yaml
constraints:
- Não alterar corpus, julgamentos de retrieval, primeira vertical ou código de aplicação.
- Não fazer inferência, chamadas pagas ou usar infraestrutura remota.
- Não marcar casos julgados nem aprovar metas em nome do PO.
execution_steps:
- Produzir casos e política com referências explícitas.
- Propor métricas e opções de custo; solicitar revisão do PO e registrar resposta quando recebida.
- Validar e registrar handoff parcial até revisão necessária.
validation:
  commands:
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - python3 datasets/evaluation/validate.py --self-test
  - git diff --check
  - git diff --cached --check
  expected_results:
  - Validar sintaxe e vínculos, referências e grupos do novo dataset; registrar limites.
dependencies:
- ACT-031
handoff_required: true
