id: SPEC-021
story_id: STORY-021
title: Triagem por API e explicação restrita avaliada
status: draft
problem_statement: A triagem determinística não é acessível para envio de incidente à API e ainda não há explicação local verificada.
proposed_solution: Preparar contrato da vertical e avaliação anterior à integração; implementar somente partes independentes de decisões pendentes.
architecture:
  components:
  - Núcleo de validação e triagem existentes, sem alterar suas regras ou resultados.
  - Gerador determinístico de frases canônicas e verificador independente de seleção e referências.
  - Camada HTTP e adaptador local dependem de decisão e avaliação prévia; alternativas em ADR-0006 proposto.
  interactions:
  - Entrada validada antes da triagem; somente classificado pode solicitar seleção ao modelo.
  - Verificador monta texto exclusivamente das frases canônicas válidas; nunca exibe texto livre do modelo.
  data_flow:
  - Incidente sintético → validação existente → triagem → frases canônicas → seleção de IDs → verificação independente → explicação ou fallback.
interfaces:
- Contrato exato da rota, envelope HTTP e integração do modelo ainda sujeitos a refinamento e ADR-0006; API atual e Problem Details permanecem compatíveis.
- A seleção estruturada contém somente IDs de frases existentes, únicos, incluindo frase de severidade máxima; texto adicional e JSON malformado são rejeitados.
data_contracts:
- Entrada respeita integralmente SPEC-011 e requisitos; entrada inválida não fornece resultado parcial nem chama o LLM.
- Resultado básico preserva incident_id, state, severity, observations, limitations e IDs da STORY-020; insuficiente não chama LLM.
- Frases canônicas derivam exclusivamente de observações e severidade; cada uma tem ID e referências ligadas aos sinais descritos; frase máxima cita ao menos um sinal do nível máximo.
- Verificar formato, duplicatas, IDs existentes, frase máxima obrigatória resolução dos vínculos evidência-sinal e correspondência de métrica, valor, unidade e período em fonte validada; não confiar em referências fornecidas pelo LLM.
- Texto final contém apenas frases canônicas verificadas; falha, indisponibilidade, timeout ou rejeição preserva o resultado básico e sinaliza limitação sem texto rejeitado.
- Limites quantitativos e estrutura de transporte permanecem pendentes de decisão; nenhuma norma sintética é política operacional.
dependencies:
- roadmap/stories/STORY-020.yaml
- agents/handoffs/HANDOFF-020.yaml
- doc/REQUIREMENTS.md
- doc/INCIDENTS.md
security_considerations:
- Sem remediação, serviços de terceiros ou dados reais; entrada e saída de modelo são dados não confiáveis.
- Não tratar referência resolúvel como prova de apoio semântico; avaliar as frases contra observações.
observability:
- Erros de entrada trazem caminhos e códigos sem valores; falhas internas e do provedor são distintas e sanitizadas.
error_handling:
- InvalidIncident prevalece sobre insuficiência; insuficiente não provoca chamada ao modelo.
- Falhas e expiração do modelo ou rejeição mantêm resultado básico e informam limitação; falhas internas não são convertidas silenciosamente em insuficiência.
implementation_steps:
- Refinar contratos e avaliação independentes; obter decisão do PO sobre ADR-0006 e limites antes da integração relevante.
- Avaliar explicação antes da integração com citações inexistentes, afirmações sem apoio e dados insuficientes; registrar amostras, critérios e limitações.
- Após decisão e avaliação satisfatória, integrar transporte e modelo, demonstrar localmente e executar testes, revisão e handoff.
test_strategy:
- Verificar três fixtures, suporte das frases, referência inexistente ou vinculada a outro sinal, duplicatas, estrutura malformada, ausência da frase máxima e texto livre.
- Verificar fim a fim sucesso, entrada inválida, insuficiência, falha, expiração, rejeição e preservação integral do resultado básico.
- Executar instalação travada, reinstalação não editável após mudanças em src, testes, Ruff, mypy, Pyright, validadores e verificações de diff.
acceptance_mapping:
- criterion_id: AC-01
  validation: Comando em doc/DEMO.md envia fixture à API e verifica resposta de inferência local real, citações e severidade; depende de decisão e avaliação.
  evidence: doc/DEMO.md
- criterion_id: AC-02
  validation: Testes HTTP fim a fim para sucesso, inválido, insuficiente, falha de LLM e fallback; verificar não chamada quando aplicável.
  evidence: tests/integration/
- criterion_id: AC-03
  validation: README diferencia capacidade demonstrada, limites e futuro; evidências sustentam avaliação futura da candidata sem publicar tag.
  evidence: README.md
- criterion_id: AC-04
  validation: Avaliação anterior à integração testa citações inexistentes, afirmações sem apoio e dados insuficientes, com referência a resultados reais e limitações.
  evidence: doc/decisions/
open_questions:
- Q-007 e Q-016: modelo, protocolo, limites, qualidade, licença e integração requerem avaliação e decisão do PO; ver ADR-0006 proposto.
related_adrs:
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/adr/0003-ambiente-python-qualidade.md
- doc/adr/0004-api-local-contratos-http.md
- doc/adr/0005-verificacao-deprecacao-tipos.md
- doc/adr/0006-proposta-integracao-colibri.md
references:
- AGENTS.md
- roadmap/stories/STORY-021.yaml
- doc/standards/workflow.md
independent_slice:
- Implementar catálogo interno imutável a partir de TriageResult classificado; IDs fixos S-MAX e S-001 em diante, associados a observações por posição.
- A frase máxima indica severidade e posição de um sinal do nível máximo; frases de observação registram métrica, valor, unidade, período e nível, sem inserir texto livre do incidente.
- Verificar seleção como objeto exato com chave sentence_ids e lista não vazia de strings; rejeitar IDs inexistentes ou repetidos, campos extras, ausência de S-MAX e referência que não resolve para o sinal correspondente no Incident validado.
- Não há chamada de modelo, fallback HTTP nem endpoint nesta fatia; testes controlados avaliam seleção e apoio das frases antes da integração.
