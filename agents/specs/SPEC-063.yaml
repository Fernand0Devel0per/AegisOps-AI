id: SPEC-063
story_id: STORY-063
title: Contrato preliminar — Avaliar recuperação e citações em documentos ricos
status: draft
problem_statement: Comparar recuperação com controles, métricas e rastreabilidade sobre corpus e ingestão revisados.
proposed_solution: Ver protocolo proposto; fixar detalhes e aprovações antes de execução.
architecture:
  components:
  - Corpus, julgamentos e gabaritos
  - Ingestão e recuperação isoladas
  - Relatórios com evidências
  interactions:
  - Sem integração à API, primeira vertical ou Colibri.
  data_flow:
  - Documentos não confiáveis → extração isolada → trechos e proveniência → avaliação, quando autorizada.
interfaces:
- Artefatos locais versionados; nenhuma mudança de contrato público.
data_contracts:
- Identidade, versão e hash do documento; âncoras de evidência, páginas/seções, relevância e ausência relativa.
- Não julgados e falhas técnicas são distintos de negativos e abstenções.
dependencies:
- doc/architecture/rich-document-evaluation-protocol.md
- roadmap/stories/STORY-063.yaml
security_considerations:
- Não executar conteúdo de documentos; dados sintéticos ou autorizados; fixar limites antes da execução.
observability:
- Registrar configuração, ambiente, tempo, CPU, memória, falhas e exclusões quando houver execução.
error_handling:
- Não converter falha de extração ou consulta em abstenção ou sucesso.
implementation_steps:
- Revisar protocolo e decisões abertas.
- Executar somente com autorização específica e dependências satisfeitas.
- Validar, revisar e registrar evidências e handoff.
test_strategy:
- Validar rastreabilidade, critérios, falhas e reproduzibilidade adequados ao incremento; sem inventar resultados.
acceptance_mapping:
- criterion_id: AC-01
  validation: Conferir evidência e denominadores conforme protocolo e critério da história.
  evidence: doc/architecture/rich-document-evaluation-protocol.md
- criterion_id: AC-02
  validation: Conferir evidência e denominadores conforme protocolo e critério da história.
  evidence: doc/architecture/rich-document-evaluation-protocol.md
- criterion_id: AC-03
  validation: Conferir evidência e denominadores conforme protocolo e critério da história.
  evidence: doc/architecture/rich-document-evaluation-protocol.md
