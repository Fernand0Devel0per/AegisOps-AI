decisions_made:
- Biblioteca padrão Python, dataclasses imutáveis e função interna de validação; nenhuma dependência estrutural
  nova ou decisão de transporte.
- Aritmética racional exata para tolerância de 5xx; metadados adicionais das fixtures são ignorados e textos não
  têm suporte semântico verificado.
- Listas de sinais e evidências simultaneamente vazias são aceitas; resultado insuficiente pertence ao motor futuro.
- Plano original local disponível e consultado nas seções de entidades e Etapas 0 a 2; ADR-0002 prevalece para o
  LLM e Pydantic é candidato não adotado. Nenhuma lacuna material identificada para esta história.
- PO aprovou as recomendações para a API em 2026-10-31; ADR-0004 registra decisões e mantém a verificação de compatibilidade
  e versões como trabalho futuro.
validation:
  executed:
  - uv sync --locked --no-editable
  - uv sync --offline --locked --no-editable --reinstall-package aegisops-ai
  - uv run --offline --locked --no-sync pytest -q
  - uv run --offline --locked --no-sync ruff check src tests
  - uv run --offline --locked --no-sync ruff format --check src tests
  - uv run --offline --locked --no-sync mypy src tests
  - 'env -i HOME=/tmp PATH=/usr/bin:/bin PYTEST_DISABLE_PLUGIN_AUTOLOAD=1 .venv/bin/python: pytest -q com socket.connect,
    connect_ex e create_connection bloqueados.'
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - git diff --check
  - git diff --cached --check
  passed:
  - check: 50 testes passaram com uv offline; repetição com ambiente limpo sem credenciais e conexões de socket
      bloqueadas também passou.
    evidence: tests/unit/test_contracts.py
  - check: Ruff check e format e mypy strict passaram; instalação normal e reinstalação offline do pacote passaram
      com Python 3.14.8.
    evidence: doc/DEVELOPMENT.md
  - check: Fixtures existentes aceitas; validador documental, validador de incidentes e verificações de whitespace
      passaram.
    evidence: agents/specs/SPEC-011.yaml
  failed: []
  not_executed:
  - 'CI remota desta alteração: sem push autorizado; CI de STORY-010 não valida este commit.'
  - 'Self-test do validador documental: não alterado nesta história.'
  - 'Motor, API, persistência e LLM: fora do escopo, não implementados.'
review:
  type: PO solicitou refatoração de estilo e depois aceitou as recomendações de API e pediu o fechamento; executor
    autorrevisou código, critérios e validações. Não se atribui ao PO execução de testes ou revisão independente
    de cada linha.
  evidence: agents/handoffs/HANDOFF-011.yaml
known_issues:
- A sincronização não editável simples reteve uma instalação antiga durante desenvolvimento; uma execução intermediária
  falhou por isso. Reinstalação forçada corrigiu e a suíte final passou.
- Uma tentativa de preparar HOME temporário foi rejeitada pelo executor por incluir rm -rf; repetida com env -i
  e HOME=/tmp, sem remoção.
- O uv emitiu aviso ao procurar symlink do Python base; instalação e testes concluíram com sucesso.
- Agregação, origem e resumo são textos não vazios, sem verificação semântica; referências existentes não provam
  causalidade ou verdade.
- A função recebe objeto já decodificado; o tratamento de JSON malformado ou chaves repetidas no texto é responsabilidade
  da fronteira futura.
pending_work:
- STORY-012 permanece em backlog e exige refinamento, especificação e atividade próprias antes da execução.
- Antes de adotar a stack HTTP, verificar versões e compatibilidade com Python 3.14.8 e registrar evidência e lockfile
  conforme ADR-0004.
- Detalhar na STORY-012 limites e forma de transporte, servidor ASGI e comportamento de saúde; CLI permanece decisão
  futura.
next_steps:
- Quando a STORY-012 for autorizada, criar ou retomar feat/story-012, refinar história e preparar SPEC e ACT antes
  de implementar.
- Preservar os ponteiros atuais até existirem os novos contratos; ler ADR-0004 e distinguir decisões aceitas de
  detalhes ainda não verificados.
