- Os hashes das dependências transitivas de build não são exigidos; versões fixadas e limitação documentada no guia.
- Tentativas iniciais do act tiveram uma opção inválida e download de imagem/cópia de ação interrompidos; execução final corrigida comprovou sucesso e falha esperada.
- O plano original é local e ignorado; um clone sem ele não executa o validador documental até migração de Q-014.
pending_work:
