- SPEC-010 e ACT-010 preparadas antes da implementação e estados da história e índice sincronizados.
- Pacote mínimo, instalação não editável, teste de instalação, lint, tipos e workflow com ações fixadas por commit.
- Instalação travada e comandos de qualidade reproduzidos em clone isolado; ausência do pacote e falha proposital detectadas.
- Workflow executado localmente com act 0.2.92 em contêiner isolado: sucesso com testes válidos e falha no passo de pytest com teste deliberado.
