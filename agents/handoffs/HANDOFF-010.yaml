decisions_made:
- Python 3.14.8 e ferramentas conforme ADR-0003 aceito; instalação não editável evita importação acidental do diretório src no teste.
- Ações são fixadas por commit de checkout v6 e setup-uv v7; versão de uv também é fixada.
- Hatchling e suas dependências de build têm versões fixas; hashes dos artefatos de build não são exigidos, limitação documentada.
validation:
  executed:
  - uv sync --locked --no-editable
  - uv run --locked --no-sync pytest -q
  - uv run --locked --no-sync ruff check src tests
  - uv run --locked --no-sync ruff format --check src tests
  - uv run --locked --no-sync mypy src tests
  - 'Clone limpo temporário a partir de snapshot local versionado isolado: repetição dos comandos de setup e qualidade.'
  - 'No clone temporário: uv pip uninstall --python .venv/bin/python aegisops-ai, pytest com falha esperada, reinstalação e falha deliberada na cadeia local.'
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - git diff --check
  - git diff --cached --check
  - 'act workflow_dispatch --job quality -P ubuntu-latest=node:24-bookworm-slim --container-architecture linux/amd64 --pull=false --local-repository astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78=DIRETORIO_TEMPORARIO: uma execução com falha deliberada e outra com teste válido.'
  passed:
  - check: Python 3.14.8, instalação travada, pytest (1 passed), Ruff e mypy passaram na raiz e em clone limpo temporário.
    evidence: doc/DEVELOPMENT.md
  - check: Após remoção do pacote no clone, pytest falhou com ModuleNotFoundError; teste deliberadamente falho fez a cadeia local retornar erro.
    evidence: tests/test_installation.py
  - check: Job local no act concluiu com sucesso; com teste deliberadamente falho retornou código 1 na etapa pytest. Checkout foi simulado pelo act e setup-uv correspondeu ao commit fixado. Logs temporários em /tmp/aegisops-story010-act-success.log e /tmp/aegisops-story010-act-final.log, não versionados.
    evidence: .github/workflows/quality.yml
  - check: Validação documental, integridade das fixtures e verificações de whitespace passaram na execução registrada.
    evidence: scripts/validate_repository.py
  failed: []
  not_executed:
