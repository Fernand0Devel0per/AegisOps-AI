- Três incidentes e uma necessidade hipotética; idioma e grupos dependentes e rótulos incompletos não permitem generalização.
- Execuções preliminares com ordem de normalização divergente foram descartadas; conformidade corrigida e resultados
  finais repetidos, sem ajuste ao ranking.
- Falhas iniciais de mypy no teste e Ruff de importação corrigidas; validador documental apontou link ao handoff
  ainda não criado, resolvido na entrega final.
- Aviso de symlink do uv e aviso de yaml do Pyright; sem falhas finais relevantes.
- Exclusão local preexistente agents/handoffs/STORY-020-blocked.md e stash STORY-021 preservados.
