decisions_made:
- Busca lexical por termos distintos, sem pesos ou sinônimos, limite 5 e empate por ID; escolhas reversíveis previstas
  na história e sem nova dependência estrutural.
- Sem divisão representativa de três incidentes; resultados exploratórios sem calibragem ou teste independente.
- Abstenção significa ausência de coincidência lexical; falhas técnicas são exceções separadas, e Q09/Q10 são ausência
  relativa e hipotética.
acceptance_evidence:
- criterion: AC-01
  result: IDs, origem, versão, caminho e hash resolvidos e testados no pacote instalado.
  evidence: tests/evaluation/test_retrieval.py
- criterion: AC-02
  result: Abstenção explícita testada e falhas técnicas não são convertidas em ausência; exemplos de ausência relativa
    medidos.
  evidence: doc/EVALUATION.md
- criterion: AC-03
  result: Recall, posição, MRR, retorno indevido, abstenção, falhas e não julgados por idioma, grupo e consulta.
  evidence: doc/EVALUATION.md
