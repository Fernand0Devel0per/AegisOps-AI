- Referências resolvíveis não comprovam verdade ou suporte semântico; limiares são sintéticos, não parâmetros de produção.
- Exclusão preexistente de agents/handoffs/STORY-020-blocked.md permanece não preparada; exclusão preexistente específica da branch feat/story-021 preservada em stash identificado para reaplicação nessa branch.
