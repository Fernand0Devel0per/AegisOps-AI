decisions_made:
- Interface pública aceita objeto decodificado, valida antes de calcular e propaga InvalidIncident sem saída parcial; não aceita dataclasses construídas diretamente.
- Observações preservam ordem dos sinais e escolhem menor ID de evidência; limitações seguem ordem fixa das métricas e avisam sobre classificação parcial.
- Resultado imutável informa explicação nao_solicitada; frases canônicas, LLM e integração à API pertencem à STORY-021.
- O aviso anterior de bloqueio pertence ao histórico da branch; o PO já registrou conclusão do gate em HANDOFF-012.
acceptance_evidence:
- criterion: AC-01
  result: As três fixtures reproduzem media, alta e alta, níveis por sinal e todas as referências esperadas; execução repetida produz resultado igual.
  evidence: tests/unit/test_triage.py
- criterion: AC-02
  result: Testes cobrem cada fronteira, unidades, janela, sobreposição, ausências, contagens 5xx, integridade e precedência de invalidez.
  evidence: tests/unit/test_triage.py
- criterion: AC-03
  result: Entrada vazia válida produz insuficiente; inválida propaga erros sem resultado; observações estruturadas não incluem hipóteses ou afirmações causais.
  evidence: tests/unit/test_triage.py
validation:
  executed:
  - uv sync --locked --no-editable
  - uv sync --offline --locked --no-editable --reinstall-package aegisops-ai
  - uv run --offline --locked --no-sync pytest -q
  - uv run --offline --locked --no-sync ruff check src tests
  - uv run --offline --locked --no-sync ruff format --check src tests
  - uv run --offline --locked --no-sync mypy src tests
  - uv run --offline --locked --no-sync pyright
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - git diff --check
  - git diff --cached --check
  passed:
  - check: 98 testes passaram offline após reinstalação não editável do pacote alterado; fixtures e testes anteriores incluídos.
    evidence: tests/unit/test_triage.py
  - check: Ruff check e format, mypy e Pyright passaram; Pyright apresentou aviso conhecido sobre resolução de yaml, sem erros.
    evidence: pyproject.toml
  - check: Validadores documental e das três fixtures passaram; scripts de incidentes validam estrutura e não substituem os testes de severidade.
    evidence: scripts/validate_incidents.py
  - check: Autorrevisão do executor comparou regras de REQUIREMENTS, observações e referências com os três cenários; sem revisão independente presumida.
    evidence: agents/specs/SPEC-020.yaml
  failed: []
  not_executed:
  - Na validação local anterior, CI remota da STORY-020 ainda não havia sido executada; conferir os checks do PR após publicação.
  - Na atualização anterior, revisão do PR e decisão de merge ainda não estavam registradas; conclusão posterior descrita em maintenance_updates.
  - Self-test do validador documental não executado pois seu código não foi alterado.
  - Integração de triagem à API, explicação e fallback não testados pois pertencem à STORY-021.
review:
  type: Autorrevisão pelo executor; PO informou em 2026-11-01 ter revisado a entrega e o PR. Nenhuma revisão formal foi registrada no GitHub; não se atribui execução de testes ao PO.
  evidence: agents/handoffs/HANDOFF-020.yaml
known_issues:
- Na primeira rodada, Ruff format e mypy apontaram formatação e inferência de tipo; ambas corrigidas e verificações passaram na rodada final.
- Instalação uv concluiu com aviso sobre leitura de symlink do Python base; Pyright relatou aviso conhecido de yaml no script documental.
- Referências resolvíveis não comprovam verdade ou suporte semântico; limiares são sintéticos, não parâmetros de produção.
- Exclusões locais preexistentes de agents/handoffs/STORY-020-blocked.md e doc/decisions/story-012-atualizacao-contexto.md permanecem fora da entrega; exclusão da branch feat/story-021 preservada em stash identificado para reaplicação nessa branch.
pending_work:
- STORY-021 permanece em backlog e requer refinamento, especificação e atividade antes da implementação.
next_steps:
- Confirmar fechamento da STORY-020 integrado à base e preparar STORY-021 quando autorizada.
- Avaliar modelo, integração local e explicação restrita conforme requisitos e ADR-0002, sem antecipar decisões estruturais.
