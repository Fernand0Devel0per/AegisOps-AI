known_issues:
- Conjunto sintético e exposto não constitui teste independente ou cego e não suporta generalização.
- Rankings B1/C1 idênticos; diferenças de métricas refletem a capacidade das representações de sustentar as relações tabulares.
- O MRR conta primeira âncora relevante e pode ser 1 mesmo quando Q06/Q07 não têm relação completa; citações resolvíveis não provam suporte.
- As seis páginas curtas couberam no orçamento; nenhuma truncação real ocorreu; teste sintético cobre a borda.
- Q10 exige união de duas páginas; Q12/Q13 retornam trechos relacionados mas insuficientes e não abstenção.
- Resultados de poucos milissegundos incluem overhead do sandbox; não são evidência de escalabilidade ou custo de produção.
- Exclusão local preexistente agents/handoffs/STORY-020-blocked.md e stash da STORY-021 foram preservados.
pending_work:
- PO revisar julgamentos semânticos, métricas e limitações; registrar aceite e resolver observações antes de marcar STORY-063 done.
- Qualquer avaliação de sidecar, texto enriquecido, modelo ou mudança estrutural requer decisão e autorização específicas; STORY-060 e EPIC-006 seguem abertos.
