decisions_made:
- B1 e C1 usaram a mesma tokenização, ranking, k e orçamento; rankings coincidiram em IDs e scores.
- O ranker recebeu apenas IDs/textos e consultas; IDs codificam documento/página, mas gabaritos e registros externos
  de proveniência não foram montados no sandbox.
- Julgamentos semânticos derivam da revisão 062 aceita e da conferência do conteúdo disponível; o cálculo e a revisão
  do executor são distintos do aceite humano.
- Limite de 1800 caracteres inclui cabeçalho de ID; metadados externos de citação não são enviados ao ranker ou
  ao contexto.
- Sidecar, texto enriquecido e Poppler layout como benchmark não foram implementados ou executados.
