known_issues:
- A primeira execução de Ruff e mypy identificou formatação, captura ampla e tipo de cabeçalho; corrigidos e verificações repetidas com sucesso.
- A primeira experiência isolada com HTTPX 0.28.1 gerou aviso de depreciação do Starlette; substituído por HTTPX2 antes da adição ao projeto.
- uv avisou sobre leitura de symlink do Python base e fallback de hardlink no teste isolado; instalação e testes passaram.
- Contrato de domínio não limita IDs; clientes e servidores podem impor limites de URL e normalizar caminhos.
- Respostas apresentam dados sintéticos validados estruturalmente; referências não comprovam causalidade nem conteúdo semântico.
