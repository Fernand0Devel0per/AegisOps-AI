decisions_made:
- Teste em ambiente isolado /tmp com Python 3.14.8 instalou FastAPI 0.162.0, Uvicorn 0.54.0 e HTTPX 0.28.1; importações, TestClient GET 200 e uvicorn --version passaram, mas Starlette alertou depreciação do HTTPX.
- No mesmo ambiente, HTTPX removido e HTTPX2 2.15.1 instalado; TestClient GET 200 passou com warnings tratados como erros. Starlette 1.10.0 e Pydantic 2.14.2 foram resolvidos. FastAPI e Uvicorn são runtime; HTTPX2 apenas teste. Lockfile registra todas as transitivas; fontes oficiais estão no ADR-0004 e no guia de desenvolvimento.
- Uvicorn é servidor ASGI para a direção já aceita no ADR-0004; TestClient utiliza HTTPX2, recomendado pela documentação do Starlette. Não foram incluídos extras de servidor ou cliente.
- Fixtures originais são incluídas no wheel por force-include sem duplicação versionada; somente recursos fixos são lidos no startup, nunca caminhos fornecidos pelo cliente.
- ID vazio ou com apenas espaços é entrada inválida do contrato existente; comparação exata sem restringir formato nem impor limite de domínio. Barras e pontos dependem do transporte e da normalização de intermediários.
- OpenAPI e interfaces interativas desabilitadas; health confirma catálogo validado em memória após inicialização, não monitora arquivos continuamente.
validation:
  executed:
  - uv venv --python /usr/bin/python3.14 e uv pip install em ambiente temporário isolado; TestClient GET 200 e uvicorn --version.
  - uv sync --locked --no-editable
  - uv sync --offline --locked --no-editable --reinstall-package aegisops-ai
  - uv run --offline --locked --no-sync pytest -q
  - uv run --offline --locked --no-sync ruff check src tests
  - uv run --offline --locked --no-sync ruff format --check src tests
  - uv run --offline --locked --no-sync mypy src tests
  - pytest com env -i, HOME=/tmp, sem credenciais e socket.connect, connect_ex e create_connection bloqueados.
  - TestClient do pacote instalado iniciado com diretório de trabalho /tmp; health e INC-003 consultados.
  - Uvicorn em 127.0.0.1 com curl para health, INC-001, ID de espaços e ID ausente; servidor encerrado em seguida.
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - git diff --check
  - git diff --cached --check
