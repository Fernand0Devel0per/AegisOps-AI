decisions_made:
- 'GitLab era uma lacuna na SPIKE: acesso raw posterior retornou os três textos integrais MIT das tags; textos,
  atribuições e hashes foram preservados. Acessibilidade pública não comprova direitos ocultos de terceiros.'
- Corpus C1-2026-11-04.1 foi aceito pelo PO em resposta conjunta após revisão; adaptação retira comandos, ações
  privilegiadas, limiares e alegações indevidas e adiciona ressalvas.
- Consultas da mesma fixture compartilham grupo inclusive INC-003; nenhuma partição atribuída, pois três fixtures
  não são representativas. PO aceitou a proposta de novos incidentes sintéticos independentes para avaliação futura;
  nenhum foi criado nesta história.
- A aceitação do corpus efetivo foi conjunta e sem comentários separados por item; ausência é relativa ao corpus,
  itens não julgados seguem distintos de negativos e medição exige política e partição prévias.
