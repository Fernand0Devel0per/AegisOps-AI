decisions_made:
- 'GitLab era uma lacuna na SPIKE: acesso raw posterior retornou os três textos integrais MIT das tags; textos,
  atribuições e hashes foram preservados. Acessibilidade pública não comprova direitos ocultos de terceiros.'
- Corpus C1-2026-11-04.1 é candidato congelado para revisão; adaptação retira comandos, ações privilegiadas, limiares
  e alegações indevidas e adiciona ressalvas.
- Consultas da mesma fixture compartilham grupo inclusive INC-003; nenhuma partição atribuída, pois três fixtures
  não são representativas. Solicitar ao PO autorização para novos incidentes sintéticos independentes antes de alegar
  generalização.
- Aceite global anterior não é revisão individual. Ausências são relativas ao corpus; itens não julgados permanecem
  distintos de negativos; conjunto não está elegível para medir.
