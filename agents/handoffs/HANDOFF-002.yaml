known_issues:
- A primeira rotina auxiliar interpretou incorretamente o código 1 do git diff --no-index como erro; a repetição corrigida passou nos oito arquivos, sem falha residual.
- O verificador confirma referências e coerência estrutural, mas não prova suporte semântico, causalidade ou correção dos rótulos de severidade.
- Os três exemplos não são uma suíte exaustiva nem estabelecem limites, regras de fronteira, dados faltantes ou política de produção.
- O diff comum não inclui arquivos não rastreados; inspeção no-index cobre whitespace dos arquivos novos.
