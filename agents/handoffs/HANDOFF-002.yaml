decisions_made:
- JSON e validador Python padrão são escolhas locais para dados documentais, não contratos finais da aplicação nem dependências estruturais.
- Rótulos media e alta são resultados propostos de exemplos, sem limiares aprovados ou política de produção.
- Q-002 continua aberta; ambiguidades observadas foram documentadas em doc/INCIDENTS.md sem decidir regras futuras.
