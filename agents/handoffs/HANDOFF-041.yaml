validation:
  executed:
  - uv sync --offline --locked --no-editable --reinstall-package aegisops-ai
  - uv run --offline --locked --no-sync pytest -q
  - uv run --offline --locked --no-sync ruff check src tests
  - uv run --offline --locked --no-sync ruff format --check src tests
  - uv run --offline --locked --no-sync mypy src tests
  - uv run --offline --locked --no-sync pyright
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - python3 datasets/evaluation/validate.py --self-test
  - git diff --check
  - git diff --cached --check
  passed:
  - check: 173 testes passaram após reinstalação; Ruff e mypy sem erros.
    evidence: tests/unit/test_descriptive.py
  - check: 'Pyright 0 erros, 1 aviso: PyYAML sem fonte resolvível em scripts/validate_repository.py.'
    evidence: doc/standards/validation.md
  - check: Validador documental passou; fixtures com 21 IDs válidos; corpus lexical com 11 unidades, 10 consultas
      e 10 mutações inválidas rejeitadas.
    evidence: doc/EVALUATION.md
  - check: Verificações de whitespace sem erros.
    evidence: agents/handoffs/HANDOFF-041.yaml
  failed:
  - Primeira execução mypy detectou tipo incompatível no teste; corrigido e reexecutado com sucesso.
  not_executed:
  - 'Inferência real, medição de modelo, uso remoto/pago e custos: não autorizados.'
  - 'Revisão humana semântica e aceite da STORY-041: ainda não ocorreram.'
  - 'Self-test do validador documental: não modificado nesta atividade.'
review:
  type: Autorrevisão pelo executor; revisão do PO pendente.
  evidence: doc/decisions/story-041-alternativas.md
known_issues:
- Entrada é estruturada; perguntas em linguagem natural continuam objetivo futuro e não são interpretadas.
- Somente DU-5XX, BK-CPU e BK-MEM têm orientação curada; não há interpretação geral de runbooks nem das fixtures
  sintéticas em texto.
- Mock não gera texto; não existe prompt de geração descritiva ou adaptador real para esta análise.
- Tempo assíncrono depende de cancelamento cooperativo; IDs não comprovam suporte semântico geral.
- Não foram medidas as métricas por estágio ou executados integralmente os 24 casos.
pending_work:
- Avaliar separadamente alternativas e riscos para perguntas em linguagem natural; não introduzir revisão humana
  por requisição.
- Completar critérios e avaliação da STORY-041 com as devidas autorizações; obter aprovação e ADR antes de
  alterações relevantes de arquitetura ou contrato público.
- Solicitar revisão da entrega e registrar evidências antes de concluir história ou atividade.
- Preparar protocolo e obter autorização específica antes de qualquer experimento real.
next_steps:
