decisions_made:
- Função Python independente e opt-in; nenhuma mudança no contrato HTTP nem no Colibri.
- Apenas fatos construídos pelo núcleo são aceitos; resposta com campos extras é rejeitada globalmente, sem
  supressão parcial.
- Comparação somente para dois sinais de mesma métrica, unidade e agregação com períodos ordenáveis não sobrepostos.
