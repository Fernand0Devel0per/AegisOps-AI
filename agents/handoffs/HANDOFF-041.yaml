known_issues:
- Não interpreta perguntas abertas ou runbooks; fixtures de texto livre não são suportadas.
- Mock não gera texto; versão de protocolo não é prompt de geração.
- Limite de tempo assíncrono depende de cancelamento cooperativo; IDs não provam suporte semântico.
- Métricas de geração bruta, aceitação, exibição, utilidade e abstenção no conjunto dos 24 casos não foram
  medidas.
