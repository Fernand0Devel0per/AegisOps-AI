  - uv sync --offline --locked --no-editable --reinstall-package aegisops-ai
  - uv run --offline --locked --no-sync pytest -q
  - uv run --offline --locked --no-sync ruff check src tests
  - uv run --offline --locked --no-sync ruff format --check src tests
  - uv run --offline --locked --no-sync mypy src tests
  - uv run --offline --locked --no-sync pyright
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - python3 datasets/evaluation/validate.py --self-test
  - git diff --check
  - git diff --cached --check
  passed:
  - check: 173 testes passaram após reinstalação; Ruff e mypy sem erros.
    evidence: tests/unit/test_descriptive.py
  - check: 'Pyright 0 erros, 1 aviso: PyYAML sem fonte resolvível em scripts/validate_repository.py.'
    evidence: doc/standards/validation.md
  - check: Validador documental passou; fixtures com 21 IDs válidos; corpus lexical com 11 unidades, 10 consultas
      e 10 mutações inválidas rejeitadas.
    evidence: doc/EVALUATION.md
  - check: Verificações de whitespace sem erros.
    evidence: agents/handoffs/HANDOFF-041.yaml
  failed:
  - Primeira execução mypy detectou tipo incompatível no teste; corrigido e reexecutado com sucesso.
