known_issues:
- Corpus pequeno e todas as páginas inferiores a 600 caracteres impedem avaliar diferença real entre estratégias
  de chunking ou generalizar.
- Saídas textuais principais intercalam colunas; Q06/Q07 não preservam associação semântica na representação salva.
- Chunks preservam texto de tabela, mas não transportam metadados nativos de células ou seções; Q10 exige evidência
  em páginas separadas.
- Medidas incluem inicialização e overhead, e memory.peak inclui o supervisor; inicialização interna reportada é
  parcial.
- Primeira versão do agrupamento não protegia tabelas em fronteiras de 600; corrigida e rodada repetida, com saídas
  idênticas neste corpus.
- Um teste sintético inicialmente usava tamanho inferior à fronteira; corrigido; lint inicial também foi corrigido
  antes da rodada final.
- Exclusão local agents/handoffs/STORY-020-blocked.md e stash da STORY-021 preservados.
