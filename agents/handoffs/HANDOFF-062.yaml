decisions_made:
- pdfplumber 0.11.10 e dependências estavam instalados; compatibilidade e licenças declaradas consultadas localmente,
  sem instalação nem modificação das dependências do projeto.
- Critérios de preservação semântica são autorrevisão do executor; buscas textuais são indicadores e não prova semântica.
- Teste de 600 caracteres não diferenciou estratégias em páginas curtas; chunks não propagam metadados nativos de
  células e seções, limitação explícita.
- Nenhum extrator ou estratégia foi adotado para produção; recuperação e STORY-063 não executadas.
