local_experiment:
  requested_by: PO em 2026-10-30; instalação e teste local do Colibri com modelo candidato.
  status: completed_with_limitations
  setup: Colibri compilado localmente a partir do commit e0db083cdc9e563e0766cc6fc661ef23c32298e0; ambiente e pesos fora do repositório.
  model: allenai/OLMoE-1B-7B-0125-Instruct, convertido localmente para int8; diretório ocupa aproximadamente 7 GiB.
  evidence: 'Máquina local: ~/.local/share/aegisops-models/colibri-test.log e olmoe-conversion.log; caminhos são locais e não constituem arquivos versionados.'
  resource_limits: Serviço systemd temporário aegisops-colibri-test, MemoryMax 7G, MemorySwapMax 1G e CPUQuota 400%; teste de inferência limitado a 300 segundos e orçamento de 5 GB do modelo.
  observations: Após reinicialização, memória disponível observada aproximadamente 10 GiB; Xet não progrediu e download foi retomado por HTTPS. Conversão concluída e uma inferência em CPU terminou em 34,49 segundos, com pico RSS de 3516808 KiB e saída zero; resultado foi truncado no limite de 64 tokens e citou logs não fornecidos. Isso não demonstra qualidade suficiente nem valida o produto.
  next_step: Avaliar respostas completas e referências com cenários controlados antes da integração; detalhar políticas de evidência e limites de recursos.
