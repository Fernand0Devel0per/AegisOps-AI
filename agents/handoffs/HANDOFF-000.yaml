decisions_made:
- Pedido atual rege colaboração por agentes; manter aprendizagem e humano como PO.
- doc/ é canônico; plano e seu registro inicial são preservados; continuidade nos handoffs.
- ADR-0001 formaliza somente a decisão explícita de monolito modular e baseline sem LLM.
- Versões, gerenciador, type checker, LLM, persistência, filas e frameworks continuam pendentes.
- STORY-001 é a próxima história pronta; STORY-010 é a primeira implementação futura, após gate humano
  STORY-004.
