known_issues:
- O modelo seguiu uma instrução adversarial de criar alegação causal sem apoio; o verificador rejeitou a resposta, mas os testes não provam robustez geral.
- Timeout encerra espera e conexão da API, mas não garante cancelamento da inferência no servidor; fila zero e operador responsável conforme ADR-0006.
- As medições são pontuais e sintéticas; 512 tokens não demonstraram ser mais rápidos que 256. Explicações podem omitir frases não obrigatórias.
- A exclusão local de agents/handoffs/STORY-020-blocked.md permanece fora da entrega.
- uv avisou sobre leitura de symlink do Python base e fallback de hardlink na instalação isolada; Pyright avisou sobre resolução de yaml, sem erros.
