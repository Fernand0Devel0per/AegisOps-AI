- criterion: AC-02
  result: Testes HTTP cobrem sucesso, inválido, insuficiente, falha, expiração e rejeição; fallback real após encerrar Colibri preservou triagem.
  evidence: tests/integration/test_investigations.py
- criterion: AC-03
  result: README distingue vertical em revisão das capacidades futuras; resultados de avaliação e demo permitem revisão de candidata, sem publicação.
