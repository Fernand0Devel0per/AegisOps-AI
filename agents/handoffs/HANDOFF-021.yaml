decisions_made:
- Seleção controlada é objeto contendo apenas sentence_ids; texto livre ou chave adicional é rejeitado; IDs canônicos são S-MAX e posição S-NNN.
- Frase máxima cita primeiro sinal no nível máximo; frases não interpolam textos livres de entrada. Verificador compara catálogo, seleção, fonte e vínculos.
- Na preparação inicial, os limites e protocolo do ADR-0006 eram propostas; após autorização posterior do PO, a decisão para a primeira vertical foi registrada no ADR.
- POST /v1/investigations responde na própria requisição, sem persistência; triage contém resultado imutável STORY-020 e explanation é envelope separado.
- Colibri opera manualmente em loopback; teto de 512 tokens, timeout de 300 s e fila zero; limites e ressalva de cancelamento em ADR-0006.
- JSON inválido retorna 400, corpo excessivo 413, contrato de domínio inválido 422; falha/rejeição preserva triagem e não exibe conteúdo do modelo.
- Entrega fica in_review até revisão solicitada e verificação do DoD; nenhuma tag ou release foi criada.
