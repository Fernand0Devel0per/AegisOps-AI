  reason: Registrar continuidade e resultados reais.
decisions_made:
- Seleção controlada é objeto contendo apenas sentence_ids; texto livre ou chave adicional é rejeitado; IDs canônicos são S-MAX e posição S-NNN.
- Frase máxima cita primeiro sinal no nível máximo; frases não interpolam textos livres de entrada. Verificador compara catálogo, seleção, fonte e vínculos.
- Os limites e protocolo do ADR-0006 são propostas não aceitas e não configuram integração implementada.
acceptance_evidence:
- criterion: AC-01
  result: Pendente; não há envio de triagem à API nem explicação de modelo real.
  evidence: agents/specs/SPEC-021.yaml
- criterion: AC-02
  result: Pendente; testes do componente isolado não são testes fim a fim da vertical.
  evidence: tests/unit/test_explanation.py
- criterion: AC-03
  result: Parcial; README distingue estado atual, mas demonstração e evidências para candidata ainda faltam.
  evidence: README.md
- criterion: AC-04
  result: Parcial; avaliação controlada de referências e afirmações não apoiadas foi executada antes da integração, mas avaliação do modelo real ainda falta.
  evidence: doc/decisions/story-021-avaliacao.md
validation:
  executed:
  - uv sync --locked --no-editable
  - uv sync --offline --locked --no-editable --reinstall-package aegisops-ai após alteração de src
  - uv run --offline --locked --no-sync pytest -q
  - uv run --offline --locked --no-sync ruff check src tests
  - uv run --offline --locked --no-sync ruff format --check src tests
  - uv run --offline --locked --no-sync mypy src tests
  - uv run --offline --locked --no-sync pyright
  - python3 scripts/validate_repository.py no workspace e em árvore temporária isolada do índice Git
  - python3 scripts/validate_incidents.py
  - git diff --check e git diff --cached --check
  passed:
  - check: 116 testes passaram em 1,94 s; 18 casos novos controlados, inclusive insuficiência e referências.
    evidence: tests/unit/test_explanation.py
  - check: Ruff, mypy e Pyright passaram; Pyright relatou aviso conhecido sobre yaml.
    evidence: pyproject.toml
  - check: Validador documental passou na árvore isolada do índice, com 68 YAML, 11 épicos, 22 histórias e 28 Markdown; plano local não foi verificado pelo script.
    evidence: scripts/validate_repository.py
  - check: As três fixtures passaram na validação estrutural; script não verifica severidade ou suporte semântico.
    evidence: scripts/validate_incidents.py
  failed:
  - Validador documental no workspace falhou pela exclusão preexistente de doc/decisions/story-012-atualizacao-contexto.md; exclusão preservada.
  not_executed:
  - Inferência real, avaliação do candidato, teste fim a fim da vertical e demo local não foram realizados; integração e limites aguardam decisão e avaliação prévia.
  - CI remota, publicação, tag, PR e revisão humana não executados nem presumidos.
review:
  type: Autorrevisão pelo executor; identificada e corrigida checagem insuficiente de correspondência da observação com sinal, coberta por teste; revisão independente e decisão do PO solicitadas.
  evidence: tests/unit/test_explanation.py
known_issues:
- Resultados controlados não demonstram utilidade, qualidade em português, licença ou estabilidade do modelo; referência válida não prova verdade.
- A SPEC permanece draft e a história com refinement_required true; não está pronta para execução da integração.
- Duas exclusões locais preexistentes preservadas no workspace; exclusão de agents/handoffs/STORY-021-blocked.md permanece em stash identificado e não integra entrega.
- O pacote não editável foi reinstalado; uv relatou aviso de leitura do symlink do Python base, sem falha da instalação.
pending_work:
- PO avaliar ADR-0006 e decidir candidato, protocolo, limites e condições para experimento e integração.
- Após decisão, avaliar modelo real antes da integração, registrar licença e resultados; completar SPEC e ACT e resolver limites quantitativos e HTTP.
- Implementar rota, fallback, testes fim a fim, doc/DEMO.md e concluir ACs, revisão e DoD antes de considerar done.
next_steps:
- Ler este handoff, SPEC-021, ACT-021, avaliação e ADR-0006; incorporar decisão explícita do PO sem reescrever ADR aceito.
- Preservar stash e exclusões locais; não publicar, abrir PR, fazer push nem criar tag sem autorização.
