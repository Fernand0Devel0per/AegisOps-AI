known_issues:
- Amostra pequena e exposta ao executor; sem teste independente ou cego, e nenhuma medida de desempenho.
- Verificação de âncoras é estrutural e não substitui leitura dos PDFs nem julgamento semântico humano.
- Pyright reporta aviso de fonte do módulo yaml no validador documental existente, sem erro.
- Primeira checagem de diff staged sinalizou whitespace interno dos PDFs, pois Git os detectou como texto; .gitattributes
  os declara binários e a checagem foi repetida.
- Exclusão local preexistente agents/handoffs/STORY-020-blocked.md e stash da STORY-021 preservados e excluídos
  da entrega.
