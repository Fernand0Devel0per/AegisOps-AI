decisions_made:
- Somente documents/ é a entrada dos mecanismos futuros; perguntas e gabaritos ficam em arquivos separados e não recuperáveis por política.
- Conjunto exploratório sem partição independente ou cega; variantes e fontes de um cenário permanecem no mesmo grupo.
- ReportLab 4.4.10 e PyYAML 6.0.2 preexistentes usados localmente; nenhuma instalação ou dependência estrutural adicionada.
