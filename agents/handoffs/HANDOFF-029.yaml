decisions_made:
- SPIKE-030 usa contrato e pasta de histórias, participa do catálogo stories e é dependência explícita de ambas as histórias seguintes.
- SPEC/ACT/HANDOFF-029 vinculam SPIKE-030 por IDs; números 030 e 031 permanecem disponíveis para contratos posteriores.
- EPIC-003 ready significa estudo preparado; ACT-029 pending e handoff partial registram que estudo e revisão ainda não aconteceram.
- Não materializar corpus final nem implementar ranking, API, embeddings, treinamento ou mudanças no Qwen nesta preparação ou no estudo delimitado.
- Licenças, amostras individuais, idiomas, quantidades, rótulos e protocolo final são resultados a examinar na Q-020; não se presume sua aprovação.
