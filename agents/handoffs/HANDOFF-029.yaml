- Preparação anterior está no histórico d374eec; execução atual autorizada pelo PO restrita à SPIKE-030.
- Fetch de origin realizado; HEAD d374eec descende de 30261c2, que contém fechamento do EPIC-002; origin/main permanece em 6206926.
