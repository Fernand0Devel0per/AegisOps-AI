decisions_made:
- Gate da STORY-050 usa STORY-021 e STORY-031 concluídas; EPIC-005 depende de EPIC-003 para o estudo autorizado.
- Manter vertical aceita; não integrar protótipo, framework ou persistência. ADR-0007 não presume aprovação
  humana de arquitetura nova.
