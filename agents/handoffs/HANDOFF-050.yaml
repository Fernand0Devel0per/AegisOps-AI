  - uv run --offline --locked --no-sync pytest -q tests/evaluation/test_workflow_050.py
  - uv run --offline --locked --no-sync pytest -q
  - uv run --offline --locked --no-sync ruff check src tests scripts/workflow_050.py
  - uv run --offline --locked --no-sync ruff format --check src tests scripts/workflow_050.py
  - uv run --offline --locked --no-sync mypy src tests scripts/workflow_050.py
  - uv run --offline --locked --no-sync pyright
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - python3 datasets/evaluation/validate.py --self-test
  - git diff --check
  - git diff --cached --check
  passed:
  - check: 12 testes específicos e 202 testes no conjunto passaram.
    evidence: tests/evaluation/test_workflow_050.py
  - check: Ruff, formato e mypy passaram; Pyright 0 erros e 1 aviso de origem PyYAML no validador.
    evidence: doc/standards/validation.md
  - check: Validadores documental e de incidentes passaram; corpus lexical e 10 mutações inválidas passaram.
    evidence: doc/architecture/workflow-evaluation.md
  - check: Autorrevisão dos critérios e das diferenças de escopo; nenhum aceite humano alegado.
    evidence: doc/architecture/workflow-evaluation.md
  - check: Sem erro de whitespace nos diffs.
    evidence: agents/handoffs/HANDOFF-050.yaml
  failed: []
  not_executed:
  - 'Reinstalação não editável: src/ não foi alterado; pacote existente usado.'
  - 'Inferência real, medição de qualidade de modelo, desempenho e custos: não autorizadas ou não realizadas.'
  - 'CI remota, push, PR e implantação: não solicitados.'
  - 'Revisão humana por outro revisor: não ocorreu; workflow permite autorrevisão.'
  - 'Self-test do validador documental: o arquivo do validador não foi alterado.'
review:
  type: Autorrevisão do executor; decisão de não alterar arquitetura existente, sem alegar aceite do PO.
  evidence: doc/architecture/workflow-evaluation.md
known_issues:
- O protótipo não tem deadline próprio, persistência, replay ou cancelamento; timeout é simulado como ModelUnavailable.
- Comparação não integra recuperação ou análise descritiva, usa código comum e não demonstra qualidade semântica.
- Seletor é callable confiável de teste, não sandbox; sem execução de ferramentas de alteração.
- STORY-041 e EPIC-004 permanecem incompletos; 24 casos e medidas reais seguem pendentes.
pending_work:
- Futuras mudanças arquiteturais ou de API exigem ADR e aprovação prévia; nenhum workflow foi adotado.
- EPIC-005 permanece em andamento por instrução do PO; não avançar automaticamente para outra história.
next_steps:
