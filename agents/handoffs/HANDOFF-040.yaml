- Na primeira entrega, doze casos simulados propostos, contexto rastreável, políticas, rubrica, métricas e opções documentados sem inferência.
- Após decisão anterior do PO, preparados mais dez casos em cinco incidentes sintéticos novos e métricas separadas por estágio, sem inferência.
- Após decisão descritiva do PO, revisados H-001 a H-022 e ajustados sete casos, sem criar casos novos; diferenças e justificativas preservadas em datasets/hypothesis-evaluation/changes-v3.yaml.
- Rubrica adaptada à intenção, precisão e revisão individual; conflito com STORY-041 e pendências de refinamento registrados.
- Após revisão do PO de H-001 a H-022, ajustados rótulos H-001, H-002 e H-012; adicionados H-023 e H-024 no grupo INC-002, sem afirmar incidentes independentes.
- Na entrega inicial a revisão foi solicitada; depois o PO aprovou a direção experimental e solicitou ajustes.
- Após entrega dos 24 casos e rubrica ajustada, PO declarou aceite para concluir a tarefa; não detalhou decisões por caso.
- Card da STORY-041 alinhado ao escopo descritivo, sem preparar sua spec, iniciar atividade ou implementar produto.
