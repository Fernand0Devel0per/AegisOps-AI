known_issues:
- Exclusão preexistente agents/handoffs/STORY-020-blocked.md e stash da STORY-021 preservados fora da entrega.
- Casos pequenos e conhecidos, incluindo cinco incidentes novos, não demonstram representatividade nem teste cego. PO aceitou a entrega conjuntamente, sem detalhar decisões por caso; os campos históricos no dataset permanecem inalterados. Fontes anteriores não foram transformadas em negativos.
- Referências válidas não provam apoio semântico e não existe verificador semântico geral implementado nesta história. A conferência pontual não encontrou incompatibilidade factual entre fontes e rótulos atualizados; ela não substitui revisão semântica humana.
- Não há segundo revisor humano nem medição de concordância interavaliadores; limitação não bloqueia automaticamente avaliação futura.
pending_work:
- Versionar e revisar futuros casos ou rótulos alterados; o conjunto atual foi aceito conjuntamente sem detalhes individuais.
- Antes de experimento real, obter aprovação dos limites técnicos e autorização específica; não há serviços pagos autorizados.
next_steps:
- Aguardar nova solicitação; STORY-041 permanece backlog e exige refinamento, spec e atividade antes de execução.
- Para experimento futuro, congelar protocolo, partição e versões; definir limites técnicos e obter autorização específica.
