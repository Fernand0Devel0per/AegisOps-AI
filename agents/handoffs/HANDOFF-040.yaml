known_issues:
- Exclusão preexistente agents/handoffs/STORY-020-blocked.md e stash da STORY-021 preservados fora da entrega.
- Casos propostos pequenos e conhecidos, incluindo cinco incidentes novos ainda sem revisão; não demonstram representatividade nem teste cego. Fontes anteriores não foram transformadas em negativos.
- Referências válidas não provam apoio semântico e não existe verificador semântico geral implementado nesta história.
- Não há segundo revisor humano nem medição de concordância interavaliadores; limitação não bloqueia automaticamente avaliação futura.
