decisions_made:
- Contextos limitados por IDs e fontes fixadas; casos e critérios são candidatos, não julgamentos aceitos.
- Todas as variantes de um incidente compartilham grupo; sem partição ou teste independente declarado.
- PO aprovou Opção B como diretriz experimental, com gates controlados, metas de geração bruta, métricas por estágio, ampliação de casos e revisão humana independente.
- PO determinou execução apenas local sem serviços pagos; limites técnicos dependem de definição e aprovação prévias. Não autorizou inferência, implantação, produção ou aceitação de resultados.
