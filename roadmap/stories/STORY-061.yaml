id: STORY-061
title: Construir corpus e julgamentos para documentos ricos
epic: EPIC-006
description: Construir e revisar corpus sintético ou autorizado com perguntas e evidências localizáveis.
objective: Construir e revisar corpus sintético ou autorizado com perguntas e evidências localizáveis.
context: Incremento proposto da STORY-060; execução depende de autorização específica e revisão dos contratos.
priority: medium
status: backlog
refinement_required: true
dependencies:
- STORY-050
scope:
  included:
  - Corpus e manifesto versionado com hashes e direitos
  - Perguntas, julgamentos e grupos de desenvolvimento e avaliação quando viável
  excluded:
  - Medição de recuperação
  - Alegar teste cego após exposição
  - Elementos visuais sem método de julgamento
acceptance_criteria:
- id: AC-01
  criterion: Documentos cobrem texto simples, tabelas, colunas, títulos hierárquicos e evidências em páginas distintas;
    visuais têm método ou exclusão explícita.
- id: AC-02
  criterion: Cada documento informa origem, autorização, versão e SHA-256; cada pergunta positiva tem resposta e
    página/seção verificáveis, relevantes e justificativa; ausências têm revisão do corpus inteiro.
- id: AC-03
  criterion: Consultas, rótulos, grupos e partições são versionados e revisados pelo PO; itens dependentes permanecem
    no mesmo grupo e partição insuficiente é declarada.
technical_constraints:
- Local-first; documentos são dados não confiáveis; não executar comandos deles.
- Sem alterar API, primeira vertical ou Colibri; sem dependências estruturais ou ferramentas candidatas sem autorização
  e ADR apropriado.
deliverables:
- datasets/rich-documents/manifest.yaml
- datasets/rich-documents/questions.yaml
- datasets/rich-documents/REVIEW.md
validation:
  automated_tests: []
  manual_checks:
  - Conferir critérios, evidências e revisão antes de encerrar; registrar validações efetivas.
references:
- doc/architecture/rich-document-evaluation-protocol.md
- doc/EVALUATION.md
- doc/decisions/open-questions.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações resolvidas; aceite do PO quando exigido.
- Handoff versionável produzido; história e índice atualizados em conjunto.
