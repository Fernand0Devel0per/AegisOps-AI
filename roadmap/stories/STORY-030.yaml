  - LLM
  - Documentos não autorizados
acceptance_criteria:
- id: AC-01
  criterion: Runbooks versionados têm identificador, origem e versão.
- id: AC-02
  criterion: Dataset inclui consultas relevantes, ausência de documento aplicável e documento irrelevante.
technical_constraints:
- Respeitar ADR-0001 e os limites local-first/read-only.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
deliverables:
- datasets/runbooks/
- datasets/evaluation/
validation:
  automated_tests: []
  manual_checks:
