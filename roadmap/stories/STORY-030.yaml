id: STORY-030
title: Especificar runbooks e baseline rotulado de recuperação
epic: EPIC-003
description: Preparar corpus Markdown e perguntas com documentos esperados antes do ranking.
objective: Preparar corpus Markdown e perguntas com documentos esperados antes do ranking.
context: SPIKE-030 concluída e C1 aceita globalmente em 2026-11-04; revisão individual das unidades efetivas e rótulos
  permanece necessária.
priority: medium
status: in_review
refinement_required: false
dependencies:
- STORY-021
- SPIKE-030
scope:
  included:
  - Corpus Markdown adaptado de unidades C1 autorizadas, com proveniência e licença por versão.
  - Dataset bilíngue próprio, julgamentos e ausência relativos ao corpus, grupos e protocolo de revisão.
  excluded:
  - Embeddings
  - Integração de LLM nesta atividade de preparação do corpus
  - Documentos não autorizados
  - Busca ou ranking e STORY-031
  - Execução de comandos, remediação ou acesso a infraestrutura das fontes
acceptance_criteria:
- id: AC-01
  criterion: Runbooks versionados têm identificador, origem e versão.
- id: AC-02
  criterion: Dataset inclui consultas relevantes, ausência de documento aplicável e documento irrelevante.
technical_constraints:
- Respeitar as partes vigentes do ADR-0001, com a substituição parcial pelo ADR-0002, e manter os limites local-first/read-only
  para a investigação.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
deliverables:
- datasets/runbooks/
- datasets/evaluation/
validation:
  automated_tests:
  - python3 datasets/evaluation/validate.py
  - python3 datasets/evaluation/validate.py --self-test
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - git diff --check
  - git diff --cached --check
  manual_checks:
  - Revisar individualmente corpus, licenças, traduções, rótulos e protocolo com PO; registrar divergências e decisão.
references:
- roadmap/epics/EPIC-003.yaml
- roadmap/stories/SPIKE-030.yaml
- agents/handoffs/HANDOFF-029.yaml
- doc/research/SPIKE-030.md
- doc/research/spike-030-fontes.yaml
- doc/INCIDENTS.md
- doc/REQUIREMENTS.md
- datasets/incidents/inc-001-latencia.json
- datasets/incidents/inc-002-erros-5xx.json
- datasets/incidents/inc-003-saturacao.json
- doc/standards/workflow.md
- doc/standards/validation.md
- AegisOps_AI_Plano_do_Zero.md
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/adr/0006-proposta-integracao-colibri.md
- doc/decisions/open-questions.md
- agents/specs/SPEC-030.yaml
- agents/activities/ACT-030.yaml
- agents/handoffs/HANDOFF-030.yaml
- datasets/runbooks/manifest.yaml
- datasets/evaluation/queries.yaml
- datasets/evaluation/REVIEW.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações do escopo resolvidas.
- Handoff versionável produzido; história e índice atualizados em conjunto.
refinement_notes: Contrato refinado conforme SPEC-030; revisão individual do PO é gate para medição e encerramento.
  Fontes cuja licença não puder ser verificada ficam excluídas.
progress_evidence:
- 'AC-01: 11 unidades propostas com versões, origem, seções, licença e hashes em datasets/runbooks/manifest.yaml;
  revisão individual do PO pendente.'
- 'AC-02: 10 consultas propostas, positivos, negativos difíceis, não julgados e ausência relativa ao corpus em datasets/evaluation/queries.yaml;
  revisão individual pendente.'
