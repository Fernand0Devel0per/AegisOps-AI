id: STORY-030
title: Especificar runbooks e baseline rotulado de recuperação
epic: EPIC-003
description: Preparar corpus Markdown e perguntas com documentos esperados antes do ranking.
objective: Preparar corpus Markdown e perguntas com documentos esperados antes do ranking.
context: Derivada da Etapa 3 do plano original; não há implementação desta capacidade no bootstrap.
priority: medium
status: backlog
refinement_required: true
dependencies:
- STORY-021
scope:
