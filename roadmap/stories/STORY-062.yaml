id: STORY-062
title: Comparar extração e chunking de documentos ricos
epic: EPIC-006
description: Medir preservação e perdas de extração e chunking com corpus revisado.
objective: Medir preservação e perdas de extração e chunking com corpus revisado.
context: Resultados exploratórios de RICH-01 v1.0.0 aceitos pelo PO em 2026-11-12; sem adoção de ferramenta.
priority: medium
status: done
refinement_required: false
dependencies:
- STORY-061
scope:
  included:
  - Extração simples e estruturada autorizada
  - Chunks por tamanho e estrutura, proveniência e medições
  excluded:
  - Adoção de ferramenta estrutural sem decisão
  - Integração à API ou execução de conteúdo
acceptance_criteria:
- id: AC-01
  criterion: Configurações e ambiente são congelados e versões, entradas, hashes, limites e falhas por documento
    registrados.
- id: AC-02
  criterion: Texto, tabelas, hierarquia, contexto e metadados de página/seção são julgados contra referência; casos
    não processados e denominadores permanecem visíveis.
- id: AC-03
  criterion: Tempo e recursos são medidos por configuração e documento, com método, ambiente e limitações; saídas
    e testes são reproduzíveis.
technical_constraints:
- Local-first; documentos são dados não confiáveis; não executar comandos deles.
- Sem alterar API, primeira vertical ou Colibri; sem dependências estruturais ou ferramentas candidatas sem autorização
  e ADR apropriado.
deliverables:
- doc/architecture/rich-document-ingestion-results.md
- datasets/rich-document-experiment/protocol.md
- datasets/rich-document-experiment/
- agents/handoffs/HANDOFF-062.yaml
validation:
  automated_tests:
  - python3 datasets/rich-document-experiment/test_pipeline.py
  - python3 scripts/validate_repository.py
  manual_checks:
  - Conferir saídas e métricas pela rubrica congelada; não confundir indicador textual com julgamento semântico.
  - Registrar resultados reais, falhas, isolamento e recursos; entregar para revisão humana.
references:
- doc/architecture/rich-document-evaluation-protocol.md
- doc/EVALUATION.md
