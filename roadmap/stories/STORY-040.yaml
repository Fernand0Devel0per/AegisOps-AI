id: STORY-040
title: Definir avaliação e políticas para análise ampliada com LLM
epic: EPIC-004
description: Fixar casos esperados e medidas de citações, apoio, custo e latência antes do experimento.
objective: Fixar casos esperados e medidas de citações, apoio, custo e latência antes do experimento.
context: EPIC-003 concluído; Etapa 4 consultada. Preparação documental distinta da explicação restrita e da avaliação lexical.
priority: medium
status: in_review
refinement_required: false
dependencies:
- STORY-031
scope:
  included:
  - Dataset e rubrica de hipóteses
  - Políticas de contexto e evidência
  - Metas prévias ao teste
  excluded:
  - Métricas fabricadas
  - Escolha de modelo sem comparação
  - Inferência, implementação de analista, gateway ou integração à API
  - Alterações no corpus ou julgamentos de recuperação
acceptance_criteria:
- id: AC-01
  criterion: Dataset e rubrica incluem citação inexistente, hipótese sem apoio, dado insuficiente e falha
    do provedor.
- id: AC-02
  criterion: Métricas/metas e procedimento de custo/latência estão definidos antes dos testes reais.
technical_constraints:
- Respeitar as partes vigentes do ADR-0001, com a substituição parcial pelo ADR-0002, e manter
  os limites local-first/read-only para a investigação.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
deliverables:
- datasets/hypothesis-evaluation/
- doc/decisions/story-040-avaliacao.md
- doc/EVALUATION.md
validation:
  automated_tests:
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - python3 datasets/evaluation/validate.py --self-test
  - git diff --check
  - git diff --cached --check
  manual_checks:
  - PO revisa casos, rótulos, rubrica, métricas, metas e limites de custo; registrar resposta e divergências.
references:
- agents/specs/SPEC-040.yaml
- agents/activities/ACT-040.yaml
- agents/handoffs/HANDOFF-040.yaml
- datasets/hypothesis-evaluation/cases.yaml
- doc/decisions/story-040-avaliacao.md
- AegisOps_AI_Plano_do_Zero.md
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/decisions/open-questions.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações do escopo resolvidas.
- Handoff versionável produzido; história e índice atualizados em conjunto.

refinement_notes: Casos e políticas são propostas; revisão humana e decisão sobre metas e custo pendentes. Nenhuma inferência realizada.
acceptance_evidence:
- "AC-01: casos e rubrica propostos em datasets/hypothesis-evaluation/cases.yaml e doc/decisions/story-040-avaliacao.md; revisão do PO pendente."
- "AC-02: métricas, procedimento e opções em doc/decisions/story-040-avaliacao.md; metas e limites ainda não aprovados pelo PO."
