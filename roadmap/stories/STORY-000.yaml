id: STORY-000
title: Preparar a fundação documental e operacional
epic: EPIC-000
description: Estabelecer contratos agent-first sem implementar a aplicação.
objective: Estabelecer contratos agent-first sem implementar a aplicação.
context: Pedido explícito de bootstrap atual; adapta o modo de colaboração e doc/ sem alterar o plano.
priority: high
status: done
refinement_required: false
dependencies: []
scope:
  included:
  - README e AGENTS
  - Roadmap e templates
  - ADR explícito do plano
  - Primeira spec/atividade e handoff do bootstrap
  - Validação documental
  excluded:
  - Código da aplicação
  - Execução da descoberta de produto
  - Publicação remota
acceptance_criteria:
- id: AC-01
  criterion: Plano original preservado byte a byte conforme hash registrado.
- id: AC-02
  criterion: README, AGENTS, workflow e cinco templates descrevem fontes, limites e continuidade.
- id: AC-03
  criterion: Etapas 0–10 catalogadas; primeira história pronta com spec e atividade; decisões candidatas
    não são aceitas.
- id: AC-04
  criterion: Sintaxe, vínculos, estados, dependências e links validados; evidências e limitações registradas
    no handoff.
technical_constraints:
- O bootstrap seguiu o ADR-0001 e os limites local-first/read-only; o ADR-0002, aceito
  posteriormente, substituiu a exclusão de LLM na primeira vertical.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
deliverables:
- README.md
- AGENTS.md
- roadmap/index.yaml
- doc/standards/workflow.md
- agents/specs/SPEC-001.yaml
- agents/activities/ACT-001.yaml
- agents/handoffs/HANDOFF-000.yaml
validation:
  automated_tests:
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_repository.py --self-test
  manual_checks:
  - Comparar documentação com o plano integral.
  - Confirmar src somente com .gitkeep e ausência de implementação.
references:
- AegisOps_AI_Plano_do_Zero.md
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/decisions/open-questions.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações do escopo resolvidas.
- Handoff versionável produzido; história e índice atualizados em conjunto.
