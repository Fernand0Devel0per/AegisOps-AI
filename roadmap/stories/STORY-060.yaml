id: STORY-060
title: Avaliar ingestão estruturada e RAG em documentos ricos
epic: EPIC-006
description: Comparar chunking e recuperação com corpus autorizado e baseline existente.
objective: Comparar chunking e recuperação com corpus autorizado e baseline existente.
context: Derivada da Etapa 6 do plano original; não há implementação desta capacidade no bootstrap.
priority: medium
status: backlog
refinement_required: true
dependencies:
- STORY-050
scope:
  included:
  - PDFs autorizados e extração
  - Chunking simples/estruturado
  - Avaliação lexical/vetorial e metadados
  excluded:
  - Superioridade pressuposta
  - Vector database sem necessidade
acceptance_criteria:
- id: AC-01
  criterion: Corpus informa autorização e perguntas com evidência conhecida.
- id: AC-02
  criterion: Comparação de chunking e retrieval reporta métricas adequadas, falhas e citações página/seção.
- id: AC-03
  criterion: Escolha Docling/FAISS/pgvector ou manutenção lexical é justificada em ADR com operação e
    limites.
technical_constraints:
- Respeitar as partes vigentes do ADR-0001, com a substituição parcial pelo ADR-0002, e manter
  os limites local-first/read-only para a investigação.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
deliverables:
- datasets/evaluation/
- doc/EVALUATION.md
validation:
  automated_tests: []
  manual_checks:
  - Dividir em histórias de corpus, ingestão e avaliação no refinamento.
references:
- AegisOps_AI_Plano_do_Zero.md
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/decisions/open-questions.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações do escopo resolvidas.
- Handoff versionável produzido; história e índice atualizados em conjunto.
