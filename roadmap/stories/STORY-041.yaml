id: STORY-041
title: Introduzir analista descritivo opcional com gateway e verificador determinístico
epic: EPIC-004
description: Introduzir análise descritiva com saída tipada, limites, mock offline e tratamento de falhas.
objective: Introduzir análise descritiva baseada em evidências, sem exigir hipóteses causais.
context: Direção descritiva definida pelo PO na STORY-040; complementa a explicação restrita da STORY-021. O card permanece backlog e requer refinamento antes de execução.
priority: medium
status: backlog
refinement_required: true
dependencies:
- STORY-040
scope:
  included:
  - Análise descritiva com observações, limites e referências rastreáveis
  - Adaptador de provedor
  - Prompt versionado
  - Timeout/tokens/fallback
  - Verificação independente de referências
  excluded:
  - Ações de alteração
  - LLM como autoridade de evidência
  - Exigência de hipóteses causais nesta etapa
  - Inferência real ou serviços remotos/pagos sem autorização específica
acceptance_criteria:
- id: AC-01
  criterion: Modo mock funciona sem internet ou credenciais; chamadas reais são opcionais.
- id: AC-02
  criterion: Referências inexistentes são rejeitadas por regras fora do LLM.
- id: AC-03
  criterion: Timeout e indisponibilidade têm resultado controlado e testes; avaliação usa dataset e métricas
    descritivas previamente preparados.
technical_constraints:
- Respeitar as partes vigentes do ADR-0001, com a substituição parcial pelo ADR-0002, e manter
  os limites local-first/read-only para a investigação.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
- Verificação de IDs não prova suporte semântico; não presumir mecanismo automático de verificação semântica.
- Limites locais técnicos e qualquer experimento real exigem aprovação do PO antes da execução.
deliverables:
- src/aegisops/
- tests/evaluation/
- doc/EVALUATION.md
validation:
  automated_tests: []
  manual_checks:
  - Avaliar comportamento com casos e métricas da STORY-040 sem confundir simulações e inferência real.
  - Registrar latência, recursos e despesas efetivamente observadas quando uma execução for autorizada; valor ausente é desconhecido.
references:
- roadmap/stories/STORY-040.yaml
- agents/handoffs/HANDOFF-040.yaml
- datasets/hypothesis-evaluation/cases.yaml
- doc/decisions/story-040-avaliacao.md
- AegisOps_AI_Plano_do_Zero.md
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/decisions/open-questions.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações do escopo resolvidas.
- Handoff versionável produzido; história e índice atualizados em conjunto.

refinement_notes: Card alinhado à descrição por decisão do PO ao concluir STORY-040; permanece backlog, sem spec ou atividade preparadas. Refinar contrato e decisões antes de implementação ou experimento.
