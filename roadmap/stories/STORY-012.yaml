id: STORY-012
title: Expor consulta de incidentes e saúde pela primeira API
epic: EPIC-001
description: Disponibilizar uma API local mínima com consulta sintética, health e erros estruturados.
objective: Disponibilizar uma API local mínima com consulta sintética, health e erros estruturados.
context: >-
  Derivada da Etapa 1 do plano original. A STORY-011 concluiu contratos locais
  independentes de transporte; a primeira API ainda não foi implementada. O PO
  aceitou a direção da API no ADR-0004, com versões e compatibilidade da stack
  HTTP ainda pendentes de verificação.
priority: high
status: backlog
refinement_required: true
dependencies:
- STORY-011
scope:
  included:
  - Rotas mínimas de consulta e saúde
  - Configuração por ambiente
  - Testes de contrato e instruções locais
  excluded:
  - Triagem já integrada
  - Jobs assíncronos
  - Banco, filas e autenticação empresarial
acceptance_criteria:
- id: AC-01
  criterion: Comandos documentados iniciam a API e consultam um incidente sintético e health.
- id: AC-02
  criterion: Entrada inválida e incidente inexistente retornam erros estruturados e testados.
- id: AC-03
  criterion: Testes da API executam em CI sem credenciais; configurações sensíveis não aparecem em repositório/logs.
technical_constraints:
- Respeitar o monolito modular e o núcleo determinístico do ADR-0001, conforme a substituição parcial
  pelo ADR-0002; manter os limites local-first/read-only.
- O ADR-0002 prevê explicação por LLM local e fallback na primeira vertical; esta história trata da
  consulta e saúde da API, sem integrar a triagem ou o LLM.
- Seguir o ADR-0004 para FastAPI, rotas de consulta e saúde, Problem Details e resposta
  na mesma requisição; manter os contratos da STORY-011 independentes do transporte.
- Verificar versões e compatibilidade da stack HTTP com Python 3.14.8 antes da adoção;
  registrar evidência e lockfile conforme ADR-0004.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
refinement_notes:
- Especificar um caso de entrada inválida observável nas rotas de consulta para AC-02,
  sem introduzir endpoint de envio ou formato arbitrário de ID apenas para o teste.
- Detalhar a representação e os limites dos IDs no transporte, preservando os requisitos
  do domínio e o tratamento seguro de referências ao catálogo local.
- Definir como disponibilizar e validar as fixtures, incluindo inicialização e significado
  de health, conforme ADR-0004.
- Definir testes da API no workflow e como registrar execução de CI efetivamente observada
  para AC-03, distinguindo-a de validação local.
- Preparar SPEC e ACT e mapear todos os critérios antes de implementar; a história permanece
  em backlog e a escolha de versões e servidor ASGI ainda não foi comprovada.
deliverables:
- src/aegisops/
- tests/integration/
- doc/DEVELOPMENT.md
validation:
  automated_tests: []
  manual_checks:
  - Reproduzir consultas e falhas por comandos documentados.
references:
- AegisOps_AI_Plano_do_Zero.md
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/adr/0003-ambiente-python-qualidade.md
- doc/adr/0004-api-local-contratos-http.md
- agents/handoffs/HANDOFF-011.yaml
- doc/decisions/story-012-atualizacao-contexto.md
- doc/decisions/open-questions.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações do escopo resolvidas.
- Handoff versionável produzido; história e índice atualizados em conjunto.
