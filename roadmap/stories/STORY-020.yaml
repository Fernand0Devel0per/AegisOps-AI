id: STORY-020
title: Implementar triagem determinística e evidências
epic: EPIC-002
description: Classificar os cenários por regras determinísticas e evidências rastreáveis, sem usar LLM para definir severidade.
objective: Classificar os cenários por regras determinísticas e evidências rastreáveis, sem usar LLM para definir severidade.
context: Derivada da Etapa 2 do plano original; não há implementação desta capacidade no bootstrap.
priority: high
status: backlog
refinement_required: true
dependencies:
- STORY-012
scope:
  included:
  - Regras e janelas aprovadas
  - IDs de evidência
  - Saída estruturada e insuficiência de dados
  excluded:
  - Integração da explicação por LLM local, prevista na STORY-021
  - Causa raiz confirmada
  - Banco e novos serviços
acceptance_criteria:
- id: AC-01
  criterion: Os três incidentes produzem severidade e evidências esperadas de forma reproduzível.
- id: AC-02
  criterion: Testes cobrem limiares, unidades, janela, dados faltantes e inconsistências.
- id: AC-03
  criterion: Dados insuficientes geram resultado explícito; relatório não afirma causa raiz.
technical_constraints:
- Respeitar as partes vigentes do ADR-0001, com a substituição parcial pelo ADR-0002, e manter
  os limites local-first/read-only para a investigação.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
deliverables:
- src/aegisops/
- tests/unit/
validation:
  automated_tests: []
  manual_checks:
  - Conferir evidências e resultado contra os cenários aceitos.
references:
- AegisOps_AI_Plano_do_Zero.md
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/decisions/open-questions.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações do escopo resolvidas.
- Handoff versionável produzido; história e índice atualizados em conjunto.
