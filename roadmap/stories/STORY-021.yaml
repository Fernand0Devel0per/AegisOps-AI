id: STORY-021
title: Integrar triagem à API e verificar candidata v0.1.0
epic: EPIC-002
description: Demonstrar envio de incidente sintético, triagem determinística e explicação local pela API.
objective: Demonstrar envio de incidente sintético, triagem determinística e explicação local pela API.
context: Derivada da Etapa 2 do plano original; não há implementação desta capacidade no bootstrap.
priority: high
status: in_review
refinement_required: false
dependencies:
- STORY-020
scope:
  included:
  - Contrato mínimo de iniciar/consultar investigação conforme duração definida
  - Integração do motor
  - Explicação por LLM local, verificação independente e fallback básico
  - Avaliação da explicação antes da integração
  - Demo local e testes end-to-end
  excluded:
  - Release publicada automaticamente
  - Remediação e LLM como autoridade de severidade ou evidências
  - Persistência durável não justificada
acceptance_criteria:
- id: AC-01
  criterion: Um comando documentado envia incidente sintético e obtém triagem, evidências e explicação
    local verificada.
- id: AC-02
  criterion: Testes end-to-end verificam sucesso, entrada inválida, dados insuficientes, falha do LLM
    e fallback básico.
- id: AC-03
  criterion: README distingue a vertical demonstrada do MVP ampliado; evidências permitem avaliar uma
    futura tag v0.1.0.
- id: AC-04
  criterion: Avaliação da explicação inclui citações inexistentes e afirmações sem apoio antes da integração.
technical_constraints:
- Respeitar as partes vigentes do ADR-0001, com a substituição parcial pelo ADR-0002, e manter os limites
  local-first/read-only para a investigação.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
deliverables:
- src/aegisops/
- tests/integration/
- doc/DEMO.md
validation:
  automated_tests:
  - uv sync --locked --no-editable
  - uv sync --offline --locked --no-editable --reinstall-package aegisops-ai
  - uv run --offline --locked --no-sync pytest -q
  - uv run --offline --locked --no-sync ruff check src tests
  - uv run --offline --locked --no-sync ruff format --check src tests
  - uv run --offline --locked --no-sync mypy src tests
  - uv run --offline --locked --no-sync pyright
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - git diff --check
  - git diff --cached --check
  manual_checks:
  - Reproduzir a vertical em ambiente local limpo.
references:
- agents/specs/SPEC-021.yaml
- agents/activities/ACT-021.yaml
- agents/handoffs/HANDOFF-021.yaml
- doc/decisions/story-021-avaliacao.md
- doc/adr/0006-proposta-integracao-colibri.md
- AegisOps_AI_Plano_do_Zero.md
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/decisions/open-questions.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações do escopo resolvidas.
- Handoff versionável produzido; história e índice atualizados em conjunto.
