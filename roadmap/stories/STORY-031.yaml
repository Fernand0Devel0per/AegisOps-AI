id: STORY-031
title: Implementar e avaliar recuperação lexical de runbooks
epic: EPIC-003
description: Recuperar trechos por tags/palavras-chave com proveniência verificável.
objective: Recuperar trechos por tags/palavras-chave com proveniência verificável.
context: Derivada da Etapa 3 do plano original; não há implementação desta capacidade no bootstrap.
priority: medium
status: done
refinement_required: false
dependencies:
- SPIKE-030
- STORY-030
scope:
  included:
  - Ranking simples
  - Proveniência por trecho
  - Medição no dataset
  excluded:
  - Vetores
  - Docling
  - Alegar superioridade sem medir
acceptance_criteria:
- id: AC-01
  criterion: Cada trecho retornado contém ID e arquivo/versão resolvíveis.
- id: AC-02
  criterion: Ausência de documento aplicável tem saída explícita testada.
- id: AC-03
  criterion: Resultados e falhas no dataset são registrados como baseline lexical.
technical_constraints:
- Respeitar as partes vigentes do ADR-0001, com a substituição parcial pelo ADR-0002, e manter os limites local-first/read-only
  para a investigação.
- Não introduzir ferramenta estrutural sem ADR e aprovação quando ainda não autorizada.
deliverables:
- src/aegisops/
- tests/evaluation/
- doc/EVALUATION.md
validation:
  automated_tests:
  - python3 datasets/evaluation/validate.py --self-test
  - python3 scripts/validate_repository.py
  - python3 scripts/validate_incidents.py
  - uv run --offline --locked --no-sync pytest -q
  - uv run --offline --locked --no-sync ruff check src tests
  - uv run --offline --locked --no-sync ruff format --check src tests
  - uv run --offline --locked --no-sync mypy src tests
  - uv run --offline --locked --no-sync pyright
  - git diff --check
  - git diff --cached --check
  manual_checks:
  - Conferir exemplos de acerto, erro e ausência.
references:
- roadmap/stories/SPIKE-030.yaml
- doc/research/SPIKE-030.md
- doc/research/spike-030-fontes.yaml
- AegisOps_AI_Plano_do_Zero.md
- doc/adr/0001-monolito-modular-baseline-deterministico.md
- doc/adr/0002-llm-local-primeira-vertical.md
- doc/decisions/open-questions.md
- agents/specs/SPEC-031.yaml
- agents/activities/ACT-031.yaml
- agents/handoffs/HANDOFF-031.yaml
- doc/EVALUATION.md
definition_of_done:
- Todos os critérios de aceite com evidência recuperável.
- Validações pertinentes executadas; não executadas e falhas explicitadas.
- Revisão registrada e observações do escopo resolvidas.
- Handoff versionável produzido; história e índice atualizados em conjunto.
refinement_notes: Implementação e medição exploratória autorrevisadas; sem teste independente nem validação do PO
  nesta entrega.
completion_evidence:
- 'AC-01: recursos do pacote, hashes, caminho, versão e fontes testados em tests/evaluation/test_retrieval.py.'
- 'AC-02: saída abstained e CorpusError separados e testados; ausência relativa examinada em doc/EVALUATION.md.'
- 'AC-03: medidas, numeradores, denominadores, resultados e limites em doc/EVALUATION.md e datasets/evaluation/results-c1-lexical.json.'
