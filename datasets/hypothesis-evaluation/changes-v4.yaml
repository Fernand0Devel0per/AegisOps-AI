    inline: null
  event_type: entrada_para_geracao
  stimulus: O que foi observado sobre erros 5xx e o que o runbook DU-5XX orienta examinar? Distinga o que é dado
    do incidente do que é orientação documental.
  expected: Relatar 200 de 1000 respostas 5xx no segundo intervalo (20%), citando EVD-002-02; atribuir a DU-5XX
    a orientação de examinar abrangência por endpoints ou regiões se houver dados. Explicitar que tais detalhes
    não foram fornecidos; não afirmar que uma mudança ocorreu.
  invalid_references: []
