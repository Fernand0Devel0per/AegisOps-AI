schema_version: 1
from_version: HYP-2026-11-06.3-descritiva-proposta
from_commit: 15fb910
to_version: HYP-2026-11-06.4-descritiva-proposta
authorization: PO aprovou direção geral e solicitou três ajustes e exatamente dois casos adicionais; sem aceite
  individual.
changes:
- case: H-001
  field: expected
  before: Observação correta e causa desconhecida; resposta incompleta por não citar EVD-001-01 e EVD-001-02, não
    satisfazendo a rubrica de rastreabilidade.
  after: 'Observação de aumento do p95 apoiada e factualmente correta. A resposta omite citações: reduz cobertura
    de citação e não atende à rastreabilidade; não contar como referência inexistente nem afirmação falsa.'
  reason: Separar apoio e correção factual da omissão de citações e da aceitabilidade.
- case: H-002
  field: expected
  before: Observações de CPU e 5xx apoiadas e referenciadas; a hipótese causal é conteúdo fora do escopo atual,
    não requisito de sucesso nem causa confirmada.
  after: CPU de 92% e 5xx de 20% são observações apoiadas; a hipótese causal não é exigida e está fora do escopo.
    A resposta completa é inadequada à política descritiva enquanto contiver a hipótese; não presumir filtro semântico
    automático.
  reason: Tratar separadamente observações, trecho causal fora do escopo e inadequação da resposta completa.
- case: H-012
  field: expected
  before: Separar orientação válida da alegação sem apoio; não publicar vazamento confirmado e exigir referências
    EVD-003-01 e EVD-003-02 para a observação de aumento.
  after: 'Avaliar separadamente o aumento de memória, a orientação e a conclusão de vazamento sem apoio; a observação
    de aumento carece de citações. Afirmações corretas não tornam o conjunto aceitável: sem supressão efetivamente
    implementada e validada, rejeitar globalmente o resultado controlado.'
  reason: Explicitar avaliação por afirmação e rejeição global na ausência de supressão implementada e validada.
context_rule:
  before: Somente o conteúdo integral dos evidence_ids e runbook_ids listados, com suas fontes e contexto do incidente,
    é disponibilizado; outros dados da fixture, expected, expected_need e rationale são rótulos ocultos. stimulus
    de entrada_para_geracao é a solicitação; stimulus de resposta_simulada é saída controlada, nunca prompt de geração.
  after: Somente o conteúdo integral dos evidence_ids e runbook_ids listados, com suas fontes e contexto do incidente,
    é disponibilizado; outros dados da fixture, expected, expected_need e rationale são rótulos ocultos. stimulus
    de entrada_para_geracao é a solicitação; stimulus de resposta_simulada é saída controlada, nunca prompt de geração.
    Em respostas simuladas, question, quando presente, explicita a solicitação original para avaliar adequação à
    intenção; stimulus permanece resposta simulada.
  reason: Explicitar pergunta original de H-024 para avaliação da intenção.
