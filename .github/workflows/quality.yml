name: Quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Set up uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
        with:
          version: 0.12.24
      - name: Install locked dependencies
        run: uv sync --locked --no-editable
      - name: Test installed package and API
        run: uv run --locked --no-sync pytest -q
      - name: Lint
        run: uv run --locked --no-sync ruff check src tests
      - name: Check formatting
        run: uv run --locked --no-sync ruff format --check src tests
      - name: Check types
        run: uv run --locked --no-sync mypy src tests
